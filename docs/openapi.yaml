components:
  schemas:
    User:
      properties:
        id:
          type: integer
        username:
          type: string
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        role_id:
          type: number
        groups:
          type: array
          items:
            $ref: '#/components/schemas/Group'
    UserCreate:
      properties:
        username:
          type: string
        password:
          type: string
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        role_id:
          type: number
          nullable: true
        groups:
          type: array
          items:
            type: number
          nullable: true
    UserUpdate:
      properties:
        username:
          type: string
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        role_id:
          type: number
          nullable: true
        groups:
          type: array
          items:
            type: number
          nullable: true
    UserLogin:
      properties:
        username:
          type: string
        password:
          type: string

    Group:
      properties:
        id:
          type: integer
        name:
          type: string
    GroupCreate:
      properties:
        name:
          type: string
    GroupUpdate:
      properties:
        name:
          type: string

    Role:
      properties:
        id:
          type: integer
        name:
          type: string
    RoleCreate:
      properties:
        name:
          type: string
    RoleUpdate:
      properties:
        name:
          type: string

    Record:
      properties:
        id:
          type: integer
        name:
          type: string
        group_id:
          type: number
        behavior_set_id:
          type: number
        comment:
          type: string
          nullable: true
        created_at:
          type: number
    RecordCreate:
      properties:
        name:
          type: string
        group_id:
          type: number
        behavior_set_id:
          type: number
        comment:
          type: string
          nullable: true
  
    Behavior:
      properties:
        id:
          type: integer
        name:
          type: string
    BehaviorCreate:
      properties:
        name:
          type: string
    BehaviorUpdate:
      properties:
        name:
          type: string
