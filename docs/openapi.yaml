  /behaviors:
    post:
      tags:
        - behaviors
      summary: Create a behavior
      description: This can only be done by the user with `can_manage_behaviors` permission.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BehaviorCreate'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Behavior'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '409':
          description: Behavior with this name already exist

    get:
      tags:
        - behaviors
      summary: List all behaviors
      description: This can only be done by the user with `can_manage_behaviors` permission.
      responses:
        '200':
          description: List of behaviors
          content:
            application/json:
              schema:
                type: array
