openapi: 3.0.4
info:
  title: SoftTrack API
  version: 0.1.1

paths:
  /users:
    post:
      tags:
        - users
      summary: Create user
      description: This can only be done by the user with `can_manage_users` permission.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '409':
          description: Username is taken already

    get:
      tags:
        - users
      summary: List all users
      description: This can only be done by the user with `can_manage_users` permission.
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /users/{id}:
    get:
      tags:
        - users
      summary: Get user by ID
      description: This can only be done by the user with `can_manage_users` permission.
      responses:
        '200':
          description: A single user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found

    put:
      tags:
        - users
      summary: Update user information
      description: This can only be done by the user with `can_manage_users` permission.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found

    delete:
      tags:
        - users
      summary: Delete user
      description: This can only be done by the user with `can_manage_users` permission.
      responses:
        '200':
          description: Success
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found

  /users/login:
    post:
      tags:
        - users
      summary: Log into user account
      description: Saves JWT token in the cookie if logged in successfully.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLogin'
      responses:
        '200':
          description: Success
        '401':
          description: Unauthorized

  /groups:
    post:
      tags:
        - groups
      summary: Create group
      description: This can only be done by the user with `can_manage_groups` permission.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupCreate'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '409':
          description: Group with this name already exist

    get:
      tags:
        - groups
      summary: List all groups
      description: This can only be done by the user with `can_manage_groups` permission.
      responses:
        '200':
          description: List of groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /groups/{id}:
    get:
      tags:
        - groups
      summary: Get group by ID
      description: This can only be done by the user with `can_manage_groups` permission.
      responses:
        '200':
          description: A single group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found

    put:
      tags:
        - groups
      summary: Update group
      description: This can only be done by the user with `can_manage_groups` permission.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupUpdate'
      responses:
        '200':
          description: Group updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found

    delete:
      tags:
        - groups
      summary: Delete group
      description: This can only be done by the user with `can_manage_groups` permission.
      responses:
        '200':
          description: Success
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found

  /roles:
    post:
      tags:
        - roles
      summary: Create role
      description: This can only be done by the user with `can_manage_roles` permission.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleCreate'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '409':
          description: Role with this name already exist

    get:
      tags:
        - roles
      summary: List all roles
      description: This can only be done by the user with `can_manage_roles` permission.
      responses:
        '200':
          description: List of roles
          content:
            application/json:
