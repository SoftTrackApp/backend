components:
  schemas:
    User:
      properties:
        id:
          type: integer
        username:
          type: string
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        role_id:
          type: number
          nullable: true
        groups:
          type: array
          items:
            $ref: '#/components/schemas/Group'
        records:
          type: array
          items:
            $ref: '#/components/schemas/Record'
    UserCreate:
      properties:
        username:
          type: string
        password:
          type: string
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        role_id:
          type: number
          nullable: true
        groups:
          type: array
          items:
            type: number
          nullable: true
    UserUpdate:
      properties:
        username:
          type: string
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        role_id:
          type: number
          nullable: true
        groups:
          type: array
          items:
            type: number
          nullable: true
    UserLogin:
      properties:
        username:
          type: string
        password:
          type: string

    Group:
      properties:
        id:
          type: integer
        name:
          type: string
    GroupCreate:
      properties:
        name:
          type: string
    GroupUpdate:
      properties:
        name:
          type: string

    Role:
      properties:
        id:
          type: integer
        name:
          type: string
        permission_bits:
          type: number
    RoleCreate:
      properties:
        name:
          type: string
        permission_bits:
          type: number
    RoleUpdate:
      properties:
        name:
          type: string
        permission_bits:
          type: number

    Record:
      properties:
        id:
          type: integer
        name:
          type: string
        creator_user_id:
          type: number
        behavior_id:
          type: number
        comment:
          type: string
          nullable: true
        created_at:
          type: number
    RecordCreate:
      properties:
        name:
          type: string
        behavior_id:
          type: number
        comment:
          type: string
          nullable: true

    Behavior:
      properties:
        id:
          type: integer
        name:
          type: string
        skills:
          type: array
          items:
            type: number
    BehaviorCreate:
      properties:
        name:
          type: string
        skills:
          type: array
          items:
            type: number
    BehaviorUpdate:
      properties:
        name:
          type: string
        skills:
          type: array
          items:
            type: number

    BehaviorSet:
      properties:
        id:
          type: integer
        name:
          type: string
        behaviors:
          type: array
          items:
            $ref: '#/components/schemas/Behavior'
    BehaviorSetCreate:
      properties:
        name:
          type: string
        behaviors:
          type: array
          items:
            type: number
    BehaviorSetUpdate:
      properties:
        name:
          type: string
        behaviors:
          type: array
          items:
            type: number

    Skill:
      properties:
        id:
          type: integer
        name:
          type: string
        behaviors:
          type: array
          items:
            type: number
    SkillCreate:
      properties:
        name:
          type: string
        behaviors:
          type: array
          items:
            type: number
    SkillUpdate:
      properties:
        name:
          type: string
        behaviors:
          type: array
          items:
            type: number

    UserComment:
      properties:
        id:
          type: integer
        commentator_user_id:
          type: number
        target_user_id:
          type: number
        comment:
          type: string
        created_at:
