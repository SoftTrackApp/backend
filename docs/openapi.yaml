    get:
      tags:
        - users
      summary: List all records of a user
      description: This can only be done by the user with `can_manage_records` permission.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Record'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found

