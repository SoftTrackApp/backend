        '404':
          description: Not found

  /records:
    post:
      tags:
        - records
      summary: Create record
      description: This can only be done by the user with `can_manage_records` permission.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordCreate'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Record'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

    get:
      tags:
        - records
      summary: List all records
      description: This can only be done by the user with `can_manage_records` permission.
      responses:
        '200':
          description: List of records
          content:
            application/json:
              schema:
                type: array
                items:
