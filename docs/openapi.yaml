openapi: 3.0.4
info:
  title: SoftTrack API
  version: 0.1.1

paths:
  /users:
    post:
      tags:
        - users
      summary: Create user
      description: This can only be done by the user with `can_manage_users` permission.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '409':
          description: Username is taken already

    get:
      tags:
        - users
      summary: List all users
      description: This can only be done by the user with `can_manage_users` permission.
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /users/{id}:
    parameters:
      - name: id
        in: path
        schema:
          type: number
        required: true

    get:
      tags:
        - users
      summary: Get user by ID
      description: This can only be done by the user with `can_manage_users` permission.
      responses:
        '200':
          description: A single user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found

    put:
      tags:
        - users
      summary: Update user information
      description: This can only be done by the user with `can_manage_users` permission.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found

    delete:
      tags:
        - users
      summary: Delete user
      description: This can only be done by the user with `can_manage_users` permission.
      responses:
        '200':
          description: Success
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found

  /users/{id}/comments:
    parameters:
      - name: id
        in: path
        schema:
          type: number
        required: true

    post:
      tags:
        - users
      summary: Create user comment
      description: This can only be done by the user with `can_manage_user_comments` permission.
      requestBody:
