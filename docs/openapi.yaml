openapi: 3.0.4
info:
  title: SoftTrack API
  version: 0.1.0

paths:
  /users:
    post:
      tags:
        - users
      summary: Create user
      description: This can only be done by the user with `can_manage_users` permission.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '409':
          description: Username is taken already

    get:
      tags:
        - users
      summary: List all users
      description: This can only be done by the user with `can_manage_users` permission.
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /users/{id}:
    get:
      tags:
        - users
      summary: Get user by ID
      description: This can only be done by the user with `can_manage_users` permission.
      responses:
        '200':
          description: A single user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found

    put:
      tags:
        - users
      summary: Update user information
      description: This can only be done by the user with `can_manage_users` permission.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found

    delete:
      tags:
        - users
      summary: Delete user
      description: This can only be done by the user with `can_manage_users` permission.
      responses:
        '200':
          description: Success
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found

  /groups:
    post:
      tags:
        - groups
      summary: Create group
      description: This can only be done by the user with `can_manage_groups` permission.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupCreate'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '409':
          description: Group with this name already exist

    get:
      tags:
        - groups
      summary: List all groups
      description: This can only be done by the user with `can_manage_groups` permission.
      responses:
        '200':
          description: List of groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /groups/{id}:
    get:
      tags:
        - groups
      summary: Get group by ID
      description: This can only be done by the user with `can_manage_groups` permission.
      responses:
        '200':
          description: A single group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found

    put:
      tags:
        - groups
      summary: Update group
      description: This can only be done by the user with `can_manage_groups` permission.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupUpdate'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found

    delete:
      tags:
        - groups
      summary: Delete group
      description: This can only be done by the user with `can_manage_groups` permission.
      responses:
        '200':
          description: Success
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found

components:
  schemas:
    User:
      properties:
        id:
          type: integer
        username:
          type: string
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
    UserCreate:
      properties:
        username:
          type: string
        password:
          type: string
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
    UserUpdate:
      properties:
        username:
          type: string
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true

    Group:
      properties:
        id:
          type: integer
        name:
          type: string
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
    GroupCreate:
      properties:
        name:
          type: string
        users:
          type: array
          items:
            type: number
    GroupUpdate:
      properties:
        name:
          type: string
        users:
          items:
            type: number
