      summary: Get role by ID
      description: This can only be done by the user with `can_manage_roles` permission.
      responses:
        '200':
          description: A single role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found

    put:
      tags:
        - roles
      summary: Update role
      description: This can only be done by the user with `can_manage_roles` permission.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleUpdate'
      responses:
        '200':
          description: Role updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found

    delete:
      tags:
        - roles
      summary: Delete role
      description: This can only be done by the user with `can_manage_roles` permission.
      responses:
        '200':
          description: Success
        '401':
