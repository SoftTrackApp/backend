  /behaviors/{id}:
    get:
      tags:
        - behaviors
      summary: Get behavior by ID
      description: This can only be done by the user with `can_manage_behaviors` permission.
      responses:
        '200':
          description: A single behavior
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Behavior'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found

    put:
      tags:
        - behaviors
      summary: Update a behavior
      description: This can only be done by the user with `can_manage_behaviors` permission.
      requestBody:
        content:
