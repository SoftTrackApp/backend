components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        groups:
          type: array
          items: 
            type: number
        role_id:
          type: integer
    EditableUser:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        groups:
          type: array
          items:
            type: number
        role_id:
          type: number
    
    Role:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        permission_bits:
          type: number
    EditableRole:
      type: object
      properties:
        name:
          type: string
        permission_bits:
          type: number
          description: May change later
    
    Group:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        users:
          type: array
          items: 
            type: number
    EditableGroup:
      type: object
      properties: 
        name:
          type: string
    
    Behavior:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        users:
          type: array
          items: 
            type: number
    EditableBehavior:
      type: object
      properties: 
        name:
          type: string
