components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        group_id:
          type: integer
    
    Board:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        behaviorSetId:
          type: number
    
    Behavior:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        behaviorSetId:
          type: number
        skillId:
          type: number
