openapi: 3.0.4
info:
  title: SoftTrack API
  version: 0.1.0

paths:
  /users:
    post:
      summary: Create a user
      tags:
        - users

      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "409":
          description: Username is already taken

    get:
      summary: Get list of users
      tags:
        - users

      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /users/{id}:
    parameters: 
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64

    put:
      summary: Update user
      tags:
        - users

      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

    delete:
      summary: Delete user
      tags:
        - users

      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /users/login:
    post:
      summary: Log into user account
      tags:
        - users

      responses:
        "200":
          description: OK (JWT token has been saved in cookie)
        "401":
          description: Invalid email or password

